[package]
name = "warehouse-load-health"
version = "0.1.0"
edition = "2021"
description = "Append-only Parquet loader for personal_groktor health metrics"
license = "MIT"
publish = false

[dependencies]
arrow-array = "53.4"
arrow-schema = "53.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
getrandom = "0.2"
parquet = { version = "53.4", default-features = false, features = ["arrow", "snap"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
