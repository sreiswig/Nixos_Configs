version: 2

models:
  - name: fct_health_daily
    description: One row per America/Chicago date and metric kind.
    columns:
      - name: metric_day_key
        tests:
          - not_null
          - unique
      - name: local_date
        tests: [not_null]
      - name: kind
        tests:
          - not_null
          - relationships:
              to: ref('dim_metric_kind')
              field: kind
      - name: value
        tests: [not_null]
      - name: unit
        tests:
          - not_null
          - accepted_values:
              values: ["hours", "%", "bpm", "ms", "count", "kcal", "min", "kg", "score", "unknown"]
      - name: category
        tests:
          - not_null
          - accepted_values:
              values: ["sleep", "heart", "activity", "body", "recovery", "other"]

  - name: dim_metric_kind
    description: Metric kind dimension for the health domain.
    columns:
      - name: kind
        tests:
          - not_null
          - unique
          - accepted_values:
              values:
                - sleep_duration_hours
                - sleep_efficiency_pct
                - resting_heart_rate_bpm
                - heart_rate_variability_ms
                - steps
                - active_calories_kcal
                - exercise_minutes
                - weight_kg
                - body_fat_pct
                - readiness_score
                - spo2_pct
      - name: category
        tests:
          - not_null
          - accepted_values:
              values: ["sleep", "heart", "activity", "body", "recovery", "other"]
      - name: unit
        tests:
          - not_null
          - accepted_values:
              values: ["hours", "%", "bpm", "ms", "count", "kcal", "min", "kg", "score", "unknown"]
      - name: observation_count
        tests: [not_null]
