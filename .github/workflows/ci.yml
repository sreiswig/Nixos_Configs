name: NixOS Flake Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-flake:
    runs-on: ubuntu-24.04
    steps:
      # v5 (resolved 2026-08-11 via git ls-remote refs/tags/v5 == v5.1.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v22 (ef8a148080ab6020fd15196c2084a2eea5ff2d25) — prefer release tag over tip-of-main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check

  build-configs:
    needs: check-flake
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Three hosts only for now; asus_rog_1070 and dad_nas are intentionally excluded.
        host: [sam-main, framework13, AIServer]
    steps:
      # v5 (resolved 2026-08-11 via git ls-remote refs/tags/v5 == v5.1.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v22 (ef8a148080ab6020fd15196c2084a2eea5ff2d25) — prefer release tag over tip-of-main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Dry-run Build
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v5 (resolved 2026-08-11 via git ls-remote refs/tags/v5 == v5.1.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Spark network self-heal tests
        run: bash scripts/spark/test-network-self-heal.sh
      - name: shellcheck Spark scripts
        run: shellcheck scripts/spark/*.sh
      - name: Parse Windows remote-hardening script
        shell: pwsh
        run: |
          $path = Join-Path (Get-Location) 'scripts/windows/remote-hardening.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) {
              Write-Output $parseError.ToString()
            }
            exit 1
          }
