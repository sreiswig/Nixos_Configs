name: NixOS Flake Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  host-flake-unit:
    runs-on: ubuntu-latest
    steps:
      # Same pinned checkout as the Nix jobs below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: In-memory hostname → flake resolver tests
        run: sh tests/host_flake_test.sh

  check-flake:
    runs-on: ubuntu-latest
    steps:
      # v5 (resolved 2026-08-11 via git ls-remote refs/tags/v5 == v5.1.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v22 (ef8a148080ab6020fd15196c2084a2eea5ff2d25) — prefer release tag over tip-of-main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check

  build-configs:
    needs: check-flake
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Three hosts only for now; asus_rog_1070 and dad_nas are intentionally excluded.
        host: [sam-main, framework13, AIServer]
    steps:
      # v5 (resolved 2026-08-11 via git ls-remote refs/tags/v5 == v5.1.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v22 (ef8a148080ab6020fd15196c2084a2eea5ff2d25) — prefer release tag over tip-of-main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Dry-run Build
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run
