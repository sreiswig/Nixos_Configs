name: NixOS Flake Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-flake:
    runs-on: ubuntu-latest
    steps:
      # v5 (resolved 2026-08-11 via git ls-remote refs/tags/v5 == v5.1.0)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # v22 (ef8a148080ab6020fd15196c2084a2eea5ff2d25) — prefer release tag over tip-of-main
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix flake check

  build-configs:
    needs: check-flake
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [sam-main, framework13, AIServer]
    steps:
      # v5 (resolved 2026-08-11 via git ls-remote refs/tags/v5 == v5.1.0)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # v22 (ef8a148080ab6020fd15196c2084a2eea5ff2d25) — prefer release tag over tip-of-main
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Dry-run Build
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run
