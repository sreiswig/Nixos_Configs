name: NixOS Flake Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-flake:
    runs-on: ubuntu-24.04
    steps:
      # v5 (resolved 2026-08-11 via git ls-remote refs/tags/v5 == v5.1.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v22 (ef8a148080ab6020fd15196c2084a2eea5ff2d25) — prefer release tag over tip-of-main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Advertise KVM to Nix
        run: |
          echo "system-features = nixos-test benchmark big-parallel kvm uid-range" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
      - run: nix flake check
      # flake check builds checks.x86_64-linux.warehouse. This step is the
      # explicit VM-test run (cache hit when flake check already built it).
      - name: Warehouse NixOS VM test
        run: nix build .#checks.x86_64-linux.warehouse --print-build-logs

  build-configs:
    needs: check-flake
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Three hosts only for now; asus_rog_1070 and dad_nas are intentionally excluded.
        host: [sam-main, framework13, AIServer]
    steps:
      # v5 (resolved 2026-08-11 via git ls-remote refs/tags/v5 == v5.1.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v22 (ef8a148080ab6020fd15196c2084a2eea5ff2d25) — prefer release tag over tip-of-main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Dry-run Build
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run
