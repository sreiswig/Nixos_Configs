name: NixOS Flake Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded pull-request runs only. Pushes to main share the
# group, but cancel-in-progress is false, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-flake:
    runs-on: ubuntu-24.04
    # Observed success max ~7.2m over recent runs; ~3x headroom.
    timeout-minutes: 25
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v23 — prefer release tag over tip-of-main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check

  build-configs:
    needs: check-flake
    runs-on: ubuntu-24.04
    # Per-matrix-job (each host). Observed dry-run success max ~1m;
    # generous for cold caches and eval growth.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Three hosts only for now; asus_rog_1070 and dad_nas are intentionally excluded.
        host: [sam-main, framework13, AIServer]
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v23 — prefer release tag over tip-of-main
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Dry-run Build
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run
